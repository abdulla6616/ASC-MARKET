<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ASC MARKET</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:#111;background:#f5f5f7}
*{box-sizing:border-box}body{margin:0;background:#f5f5f7}
.app{max-width:720px;margin:auto;padding:18px 16px 90px}
.header{display:flex;align-items:center;justify-content:space-between;margin:8px 0 18px}
.logo{font-size:25px;font-weight:800;letter-spacing:-1px}.logo span{font-weight:400}
.search{background:white;border:1px solid #e5e5e7;border-radius:16px;padding:14px 16px;font-size:16px;width:100%;outline:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.cat{background:white;border:0;border-radius:18px;padding:18px 14px;text-align:left;font-size:16px;font-weight:700;box-shadow:0 1px 3px #0000000b}
.cat small{display:block;font-size:25px;margin-bottom:9px}
.section{font-size:20px;font-weight:800;margin:24px 0 12px}
.card{background:white;border-radius:20px;overflow:hidden;margin-bottom:12px;box-shadow:0 2px 8px #0000000b}
.photo{height:190px;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:48px}
.info{padding:14px}.title{font-size:18px;font-weight:800}.meta{color:#777;margin-top:5px;font-size:14px}.price{font-size:19px;font-weight:800;margin-top:9px}
.add{position:fixed;left:16px;right:16px;bottom:18px;max-width:688px;margin:auto;border:0;border-radius:18px;padding:16px;background:#1687f5;color:white;font-size:17px;font-weight:800;box-shadow:0 8px 25px #1687f555}
.modal{display:none;position:fixed;inset:0;background:#f5f5f7;z-index:10;padding:20px 16px;overflow:auto}
.modal.open{display:block}.close{border:0;background:white;border-radius:12px;padding:10px 14px;font-size:16px}
label{display:block;font-weight:700;margin:16px 0 7px}input,textarea,select{width:100%;border:1px solid #ddd;border-radius:14px;padding:14px;font-size:16px;background:white}
.submit{margin-top:20px;width:100%;border:0;border-radius:16px;padding:16px;background:#1687f5;color:white;font-size:17px;font-weight:800}
.note{color:#777;font-size:13px;margin-top:12px;line-height:1.4}
</style>
</head>
<body>
<div class="app">
  <div class="header"><div class="logo">ASC <span>MARKET</span></div><div>🇷🇺</div></div>
  <input class="search" placeholder="🔎  Поиск объявлений" oninput="filterCards(this.value)">
  <div class="grid">
    <button class="cat" onclick="filterCards('BMW')"><small>🚗</small>Авто</button>
    <button class="cat" onclick="filterCards('мото')"><small>🏍️</small>Мото</button>
    <button class="cat" onclick="filterCards('телефон')"><small>📱</small>Телефоны</button>
    <button class="cat" onclick="filterCards('услуги')"><small>🛠️</small>Услуги</button>
  </div>
  <div class="section">🔥 Новые объявления</div>
  <div id="cards">
    <div class="card" data-search="BMW 530i авто Махачкала">
      <div class="photo">🚘</div><div class="info"><div class="title">BMW 530i</div><div class="meta">2019 • 2.0 • Бензин • Махачкала</div><div class="price">3 500 000 ₽</div></div>
    </div>
    <div class="card" data-search="мото мотоцикл">
      <div class="photo">🏍️</div><div class="info"><div class="title">Мотоцикл</div><div class="meta">Хорошее состояние • Махачкала</div><div class="price">450 000 ₽</div></div>
    </div>
  </div>
</div>

<button class="add" onclick="openForm()">＋ Подать объявление</button>

<div class="modal" id="form">
  <button class="close" onclick="closeForm()">← Назад</button>
  <h2>Подать объявление</h2>
  <label>Категория</label><select><option>Авто</option><option>Мото</option><option>Телефоны</option><option>Услуги</option><option>Другое</option></select>
  <label>Название</label><input placeholder="Например: BMW 530i">
  <label>Цена</label><input inputmode="numeric" placeholder="3 500 000 ₽">
  <label>Город</label><input placeholder="Махачкала">
  <label>Описание</label><textarea rows="5" placeholder="Расскажите о товаре или услуге"></textarea>
  <label>Фото</label><input type="file" accept="image/*" multiple>
  <button class="submit" onclick="sendDemo()">Отправить на модерацию</button>
  <div class="note">Это первая демо-версия. Пока объявления не сохраняются на сервере — следующим этапом подключим базу данных и модерацию.</div>
</div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}
function openForm(){document.getElementById('form').classList.add('open')}
function closeForm(){document.getElementById('form').classList.remove('open')}
function sendDemo(){if(tg)tg.showAlert('Объявление отправлено на модерацию (демо).');else alert('Объявление отправлено на модерацию (демо).');closeForm()}
function filterCards(q){q=q.toLowerCase();document.querySelectorAll('.card').forEach(c=>c.style.display=!q||c.dataset.search.toLowerCase().includes(q)?'block':'none')}
</script>
</body>
</html>
